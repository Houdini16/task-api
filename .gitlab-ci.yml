# ======================================================
# GitLab CI/CD Pipeline — Task-API
# Auteurs: Abdoulaye Bilal Samba DIOP & Madieye ANNE
# Groupe 1 — L3GL ISI DevOps
# ======================================================

stages:
  - build
  - docker

variables:
  MAVEN_CLI_OPTS: "--batch-mode"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE: "houdini16/task-api"
  DOCKER_TAG: "latest"

cache:
  paths:
    - .m2/repository/
    - target/

# ============================================
# Étape 1 : Compilation du JAR Maven
# ============================================
build-jar:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - echo "Clonage et installation du module task-core parent"
    - git clone https://github.com/Houdini16/task-core.git /tmp/task-core
    - cd /tmp/task-core
    - mvn clean install -DskipTests
    - cd $CI_PROJECT_DIR
  script:
    - echo "=== Compilation du projet Task-API ==="
    - mvn clean package -DskipTests
    - echo "=== Build terminé avec succès ==="
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

# ============================================
# Étape 2 : Build de l'image Docker et push
# ============================================
docker-build-push:
  stage: docker
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "Connexion a Docker Hub"
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
  script:
    - echo "Construction de l image Docker"
    - docker build -t ${DOCKER_IMAGE}:${DOCKER_TAG} .
    - echo "Push de l image sur Docker Hub"
    - docker push ${DOCKER_IMAGE}:${DOCKER_TAG}
  dependencies:
    - build-jar
