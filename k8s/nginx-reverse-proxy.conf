# ============================================
# Nginx Reverse Proxy Configuration
# Pour exposer l'application sur http://<ip-vm>/l3gl/*
# ============================================
# Placer ce fichier dans /etc/nginx/sites-available/task-api
# puis créer un lien symbolique :
#   sudo ln -s /etc/nginx/sites-available/task-api /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================

server {
    listen 80;
    server_name _;

    # Reverse proxy vers Minikube Ingress
    location /l3gl/ {
        # Récupérer l'IP du Minikube avec : minikube ip
        proxy_pass http://$(minikube ip):80/l3gl/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
